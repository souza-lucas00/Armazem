# Utiliza um banco H2 em memória exclusivo para testes.
spring.datasource.url=jdbc:h2:mem:armazem_test_${random.uuid};DB_CLOSE_DELAY=-1

# Define o driver JDBC do H2.
spring.datasource.driver-class-name=org.h2.Driver

# Define o usuário de conexão.
spring.datasource.username=sa

# Define a senha vazia para o ambiente de testes.
spring.datasource.password=

# Cria as tabelas ao iniciar o contexto e as remove ao encerrá-lo.
spring.jpa.hibernate.ddl-auto=create-drop

# Evita exibir todos os comandos SQL durante os testes.
spring.jpa.show-sql=false

# Desabilita o console H2 no ambiente de testes.
spring.h2.console.enabled=false

# Desabilita a manutenção do contexto JPA durante a renderização HTTP.
spring.jpa.open-in-view=false